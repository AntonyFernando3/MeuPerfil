   <div class="testelogin">
        <main class="container-login">
            <div class="card-acessar">
                <h2 class="titulo-acesso">Crie sua Conta</h2>
                <p class="subtitulo">Preencha os dados abaixo para se cadastrar.</p>

                <form id="form-cadastro">
                    <div class="input-group-login">
                        <input type="text" id="nome" class="input-login" placeholder="Nome Completo" required>
                    </div>

                    <div class="input-group-login">
                        <input type="email" id="email" class="input-login" placeholder="E-mail" required>
                    </div>
                    
                    <div class="input-group-login">
                        <input type="password" id="senha" class="input-login" placeholder="Senha" required>
                    </div>

                    <div class="input-group-login">
                        <input type="password" id="confirmar-senha" class="input-login" placeholder="Confirme a Senha" required>
                    </div>

                    <div class="botoes-container-login">
                        <button type="submit" class="btn-acesso btn-primario">Finalizar Cadastro</button>
                    </div>
                    
                    <div class="link-voltar">
                        <a href="login.html">Já tem uma conta? Entrar</a>
                    </div>
                </form>

                <p id="mensagem-feedback" class="hidden"></p>
            </div>
